<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12102b">
<title>Draw your hero · StoryForge</title>
<link rel="icon" href="/static/art/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Chewy&display=swap">
<link rel="stylesheet" href="/static/draw.css">
</head>
<body>
  <header class="bar bar-top">
    <a class="back" href="/" aria-label="Back to StoryForge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
    </a>
    <h1 class="visually-hidden">Draw your hero</h1>
    <!-- Optional: the child's own words ("my bunny Ricky") beat the vision model's guess. -->
    <form class="who" id="who-form" autocomplete="off">
      <label class="visually-hidden" for="who">Who is this? (you can leave it empty)</label>
      <input id="who" type="text" maxlength="60" placeholder="Who is this? e.g. my bunny Ricky" enterkeyhint="done">
      <button class="who-mic" id="who-mic" type="button" aria-label="Say who this is" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7"/></svg>
      </button>
    </form>
    <button class="done" id="done" type="button" disabled>Done</button>
    <fieldset class="levels" id="levels">
      <legend>Who is reading?</legend>
      <label><input type="radio" name="reading-level" value="pre"><span>Pre-reader</span></label>
      <label><input type="radio" name="reading-level" value="early" checked><span>Early reader <small>K-2</small></span></label>
      <label><input type="radio" name="reading-level" value="confident"><span>Confident reader <small>3-5</small></span></label>
    </fieldset>
  </header>

  <!-- The paper: its own area, never under the toolbar. -->
  <main class="workspace">
    <div class="paper" id="paper">
      <canvas id="canvas" aria-label="Drawing paper. Draw your hero here with your finger, a pen or the mouse."></canvas>
      <p class="hint" id="hint" aria-hidden="true">Draw your hero!</p>
      <p class="paper-note" id="paper-note" role="status" hidden></p>
    </div>

    <nav class="toolbar" aria-label="Drawing tools">
    <div class="tool-group tools" role="radiogroup" aria-label="Tools" id="tools">
      <button class="tool" type="button" role="radio" aria-checked="true" data-tool="marker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4 9.5-9.5 3 3L9 18z"/><path d="M13.5 7.5l3 3"/></svg>
        <span>Marker</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="crayon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l-1 3 3-1 11-11-2-2z"/><path d="M14 6l4 4M9.5 10.5l4 4M7.5 12.5l4 4"/></svg>
        <span>Crayon</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="pencil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.5-5L16 4.5l3.5 3.5L9 18.5z"/><path d="M14 6.5l3.5 3.5M5.5 15l3.5 3.5"/></svg>
        <span>Pencil</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="bucket">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5l7-7 7 7-7 7z"/><path d="M4.5 11.5h14"/><path d="M20 15c-.7 1.2-1.3 2.1-1.3 3a1.3 1.3 0 0 0 2.6 0c0-.9-.6-1.8-1.3-3z"/></svg>
        <span>Fill</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="eraser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5l9-9 7 7-6 6H8z"/><path d="M8.5 11l7 7M13 20h7"/></svg>
        <span>Eraser</span>
      </button>
    </div>
    <div class="tool-group sizes" role="radiogroup" aria-label="Brush size" id="sizes">
      <button class="size" type="button" role="radio" aria-checked="false" aria-label="Thin" data-size="0.55"><i></i></button>
      <button class="size" type="button" role="radio" aria-checked="true" aria-label="Medium" data-size="1"><i></i></button>
      <button class="size" type="button" role="radio" aria-checked="false" aria-label="Thick" data-size="1.8"><i></i></button>
    </div>
    <div class="tool-group colors" role="radiogroup" aria-label="Colours" id="colors">
      <button type="button" role="radio" aria-checked="true" aria-label="Black" data-color="#2c2340"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Brown" data-color="#8d5a3b"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Red" data-color="#e53935"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Orange" data-color="#fb8c00"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Yellow" data-color="#fbc02d"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Green" data-color="#43a047"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Teal" data-color="#00a19a"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Blue" data-color="#1e88e5"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Purple" data-color="#8e24aa"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Pink" data-color="#ec4f9f"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Light skin" data-color="#f2c9a5"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Dark skin" data-color="#a86b45"></button>
    </div>
    <div class="tool-group actions">
      <button class="tool" id="undo" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="clear" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span>Clear</span>
      </button>
    </div>
    </nav>
  </main>

  <div class="confirm" id="confirm" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text">Clear the whole drawing?</p>
      <div class="sheet-row">
        <button class="ghost" id="confirm-no" type="button">Keep it</button>
        <button class="primary" id="confirm-yes" type="button">Clear</button>
      </div>
    </div>
  </div>

  <div class="busy" id="busy" hidden>
    <div class="sheet" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="busy-text">Getting to know your hero…</p>
      <p class="busy-error" id="busy-error" hidden></p>
      <button class="primary" id="busy-retry" type="button" hidden>Let's try that again</button>
      <button class="ghost" id="busy-close" type="button" hidden>Keep drawing</button>
    </div>
  </div>

<script src="/static/listen.js"></script>
<script src="/static/draw.js"></script>
</body>
</html>
